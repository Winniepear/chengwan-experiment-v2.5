<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="format-detection" content="telephone=no">
  <title>在线旅游信息阅读研究</title>
  <link rel="stylesheet" href="/styles.css?v=2.2.0">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-row">
        <span class="topbar-dot" aria-hidden="true"></span>
        <div class="study-name">旅行内容阅读</div>
        <span id="progressText" class="progress-text" aria-hidden="true"></span>
      </div>
      <div class="progress-wrap" aria-label="实验进度">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>
  </header>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>本研究页面需要启用 JavaScript。</noscript>
  <script src="/app.js?v=2.2.0" defer></script>
</body>
</html>
